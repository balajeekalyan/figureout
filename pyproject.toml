[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "figureout"
version = "0.2.8"
description = "FigureOut - a lightweight and resilient multi-LLM orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "llm", "orchestrator", "orchestration", "multi-llm", "ai", "agents",
    "mcp", "model-context-protocol", "fastmcp", "query-classification", "routing",
    "structured-output", "json", "openai", "gemini", "claude", "anthropic",
    "llama", "mistral", "groq",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["fastmcp", "mcp>=1.25,<2", "python-dotenv"]  # mcp 2.x renamed FastMCP, whose internals FigureOut reads
authors = [
    {name = "balajeekalyan"},
]

[project.optional-dependencies]
openai  = ["openai"]
gemini  = ["google-genai", "google-api-core"]
claude  = ["anthropic"]
meta    = ["llama-api-client"]
mistral = ["mistralai"]
groq    = ["groq"]
all     = ["openai", "anthropic", "google-genai", "google-api-core", "llama-api-client", "mistralai", "groq"]
dev     = ["pytest"]
